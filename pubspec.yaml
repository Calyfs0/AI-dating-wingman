name: wingman
description: Gotchu — late-night dating companion. Stuck on a reply? Gotchu.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^16.2.1
  provider: ^6.1.5
  get_it: ^8.2.0
  equatable: ^2.0.7
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  google_fonts: ^6.3.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.5
  image_picker: ^1.2.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  # Backend-ready boundaries (configured via env; no secrets in source)
  supabase_flutter: ^2.10.0
  # Subscription-ready boundary (RevenueCat is source of truth for entitlements)
  purchases_flutter: ^8.10.6
  audioplayers: ^6.8.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/gotchu_launcher_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#07050C"
  adaptive_icon_foreground: assets/brand/gotchu_launcher_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/mockups/
    - assets/brand/
    - assets/sounds/
